<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Círculo interior elegante -->
  <circle cx="256" cy="256" r="180" fill="#1e293b"/>
  <!-- Pílula estilizada em gradiente verde esmeralda e branco -->
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Cruz médica de acolhimento / saúde -->
  <rect x="226" y="146" width="60" height="220" rx="30" fill="url(#pillGrad)"/>
  <rect x="146" y="226" width="220" height="60" rx="30" fill="url(#pillGrad)"/>
  <!-- Coração central -->
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
</svg>
